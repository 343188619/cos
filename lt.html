<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>核 摄影 | CORE PHOTOGRAPHY</title>
    <style>
        /* --- 核心基础设置 --- */
        :root {
            --bg-color: #000000;
            --text-main: #e0e0e0;
            --accent: #ff3333; /* 核能红 */
            --thumb-height: 60px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            /* 禁止文字选择 */
            user-select: none;
            -webkit-user-select: none;
            /* 禁止长按弹出菜单 */
            -webkit-touch-callout: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* --- 1. 顶部品牌栏 --- */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            z-index: 100;
            pointer-events: none; /* 让点击穿透，不影响图片滑动 */
            text-align: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
        }

        .brand-name {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 8px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            display: inline-block;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 5px;
        }

        .brand-sub {
            font-size: 0.6rem;
            letter-spacing: 3px;
            opacity: 0.7;
            margin-top: 4px;
            font-family: Arial, sans-serif;
        }

        /* --- 返回主页按钮 --- */
        .back-home-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 101;
            pointer-events: auto;
            width: 36px;
            height: 36px;
            background: rgba(20, 20, 20, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            text-decoration: none;
            cursor: pointer;
        }

        .back-home-btn:hover {
            background: rgba(40, 40, 40, 0.9);
            border-color: var(--accent);
        }

        .back-home-btn::before {
            content: "←";
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }

        /* --- 2. 主画廊容器 (Scroll Snap) --- */
        .gallery-viewport {
            flex: 1;
            width: 100%;
            height: 100%;
            overflow-x: scroll;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            display: flex;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }
        .gallery-viewport::-webkit-scrollbar { display: none; }

        .slide {
            flex: 0 0 100%;
            width: 100vw;
            height: 100%;
            scroll-snap-align: center;
            scroll-snap-stop: always;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
        }

        /* 图片层 */
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 完整显示图片，不裁切 */
            opacity: 0;
            transform: scale(1.05);
            transition: opacity 0.6s ease, transform 0.8s cubic-bezier(0.2, 1, 0.3, 1);
            pointer-events: none; /* 关键：禁止直接点击图片 */
        }

        .slide.active img {
            opacity: 1;
            transform: scale(1);
        }

        /* --- 3. 关键保护层 (透明盾牌) --- */
        /* 这个层覆盖在图片上，拦截所有长按和右键事件 */
        .protection-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10; 
            background: transparent;
        }

        /* --- 4. 底部缩略图导航 (快速切换) --- */
        .thumbs-container {
            height: 80px;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            border-top: 1px solid #222;
            display: flex;
            align-items: center;
            overflow-x: auto;
            padding: 0 10px;
            z-index: 100;
        }

        .thumb-wrapper {
            flex: 0 0 auto;
            width: 50px;
            height: 50px;
            margin-right: 10px;
            border-radius: 4px;
            overflow: hidden;
            opacity: 0.4;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .thumb-wrapper.active {
            opacity: 1;
            border-color: var(--accent);
            transform: scale(1.1);
        }

        .thumb-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* --- 加载动画 --- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .loading-text {
            margin-top: 15px;
            font-size: 12px;
            letter-spacing: 2px;
            color: #666;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 错误提示 */
        .error-msg {
            color: #555;
            font-size: 12px;
            position: absolute;
            z-index: -1;
        }
    </style>
</head>
<body oncontextmenu="return false"> <!-- 全局禁止右键 -->

    <!-- 加载页 -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="loading-text">LOADING CORE...</div>
    </div>

    <!-- 返回主页按钮 -->
    <a href=" " class="back-home-btn" title="返回主页"></a >

    <!-- 顶部品牌 -->
    <div class="header">
        <div class="brand-name">核 摄影</div>
        <div class="brand-sub">CORE VISION</div>
    </div>

    <!-- 主画廊 -->
    <div class="gallery-viewport" id="galleryViewport">
        <!-- JS生成 -->
    </div>

    <!-- 底部缩略图 -->
    <div class="thumbs-container" id="thumbsContainer">
        <!-- JS生成 -->
    </div>

    <script>
        // 原始图片链接
        const rawImages = [
            "https://img.yohuo.eu.org/1770026410148.jpg",
            "https://img.yohuo.eu.org/1770026414751.jpg",
            "https://img.yohuo.eu.org/1770026416882.jpg",
            "https://img.yohuo.eu.org/1770026420305.jpg",
            "https://img.yohuo.eu.org/1770026423955.jpg",
            "https://img.yohuo.eu.org/1770026427484.jpg",
            "https://img.yohuo.eu.org/1770026430823.jpg",
            "https://img.yohuo.eu.org/1770026434271.jpg",
            "https://img.yohuo.eu.org/1770026436801.jpg",
            "https://img.yohuo.eu.org/1770026441576.jpg",
            "https://img.yohuo.eu.org/1770026446158.jpg",
            "https://img.yohuo.eu.org/1770026449133.jpg",
            "https://img.yohuo.eu.org/1770026451808.jpg",
            "https://img.yohuo.eu.org/1770026454665.jpg",
            "https://img.yohuo.eu.org/1770026457762.jpg",
            "https://img.yohuo.eu.org/1770026462939.jpg",
            "https://img.yohuo.eu.org/1770026469047.jpeg"
        ];

        // --- 核心优化：生成 CDN 加速链接 ---
        // 使用 wsrv.nl 将图片转换为 WebP 并进行压缩，大幅提升国内加载速度
        const getOptimizedUrl = (url, width = 1080) => {
            // 去除 https:// 前缀以适配 CDN 参数
            const cleanUrl = url.replace(/^https?:\/\//, '');
            // &output=webp: 强制 WebP 格式
            // &w={width}: 限制宽度，减少流量
            // &q=80: 80% 质量，肉眼无损但体积更小
            return `https://wsrv.nl/?url=${cleanUrl}&w=${width}&output=webp&q=80`;
        };

        const galleryViewport = document.getElementById('galleryViewport');
        const thumbsContainer = document.getElementById('thumbsContainer');
        const fragmentSlides = document.createDocumentFragment();
        const fragmentThumbs = document.createDocumentFragment();

        // 动态生成内容
        rawImages.forEach((url, index) => {
            // 1. 生成主图 Slide
            const slide = document.createElement('div');
            slide.className = 'slide';
            slide.id = `slide-${index}`;
            
            // 使用高清优化图
            const mainImgUrl = getOptimizedUrl(url, 1200);
            
            slide.innerHTML = `
                <div class="error-msg">Loading...</div>
                < img src="${mainImgUrl}" loading="${index < 2 ? 'eager' : 'lazy'}" alt="Core Vision">
                <!-- 保护层：覆盖在图片上，拦截长按 -->
                <div class="protection-layer"></div>
            `;
            fragmentSlides.appendChild(slide);

            // 2. 生成底部缩略图
            const thumb = document.createElement('div');
            thumb.className = 'thumb-wrapper';
            // 缩略图使用更小的尺寸 (200px) 加速加载
            const thumbUrl = getOptimizedUrl(url, 200);
            thumb.innerHTML = `< img src="${thumbUrl}">`;
            
            // 点击缩略图跳转逻辑
            thumb.addEventListener('click', () => {
                document.getElementById(`slide-${index}`).scrollIntoView({ behavior: 'smooth' });
            });
            
            fragmentThumbs.appendChild(thumb);
        });

        galleryViewport.appendChild(fragmentSlides);
        thumbsContainer.appendChild(fragmentThumbs);

        // --- 交互逻辑 ---
        
        // 1. 监听滚动，高亮当前缩略图
        const slides = document.querySelectorAll('.slide');
        const thumbs = document.querySelectorAll('.thumb-wrapper');

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const index = Array.from(slides).indexOf(entry.target);
                    
                    // 激活大图动画
                    entry.target.classList.add('active');

                    // 更新缩略图状态
                    thumbs.forEach(t => t.classList.remove('active'));
                    if(thumbs[index]) {
                        thumbs[index].classList.add('active');
                        // 自动滚动缩略图条，保持当前选中的在视野内
                        thumbs[index].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    }
                } else {
                    entry.target.classList.remove('active');
                }
            });
        }, { threshold: 0.5 });

        slides.forEach(slide => observer.observe(slide));

        // 2. 移除加载动画
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    // 触发第一张图动画
                    if(slides[0]) slides[0].classList.add('active');
                    if(thumbs[0]) thumbs[0].classList.add('active');
                }, 500);
            }, 500); // 稍微等待一下确保DOM渲染
        });

        // 3. 增强防护逻辑 (防止 F12 或 某些浏览器的特殊操作)
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', event => {
            // 禁止 F12, Ctrl+S, Ctrl+U
            if (event.key === 'F12' || (event.ctrlKey && (event.key === 's' || event.key === 'u'))) {
                event.preventDefault();
            }
        });

    </script>
</body>
</html>
