<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>核 | GALLERY - 映像</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+SC:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* === 核心变量 === */
        :root {
            --bg-color: #f4f4f0;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --accent: #bfa15f;
            /* 降低透明度以模拟玻璃感，减少模糊滤镜的使用 */
            --glass: rgba(255, 255, 255, 0.85);
            --glass-heavy: rgba(255, 255, 255, 0.98);
            --glass-border: rgba(0, 0, 0, 0.06);
            --glass-shadow: 0 10px 30px rgba(0,0,0,0.05);
            --frame-bg: #e8e8e5;
            
            /* 背景光斑颜色 */
            --orb-1: #bfa15f;
            --orb-2: #c8c8c8;
            --orb-3: #dcd2c8;
        }

        [data-theme="dark"] {
            --bg-color: #050505;
            --text-primary: #e0e0e0;
            --text-secondary: #8c8c8c;
            --accent: #d4af37;
            --glass: rgba(20, 20, 20, 0.85);
            --glass-heavy: rgba(20, 20, 20, 0.98);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 15px 40px rgba(0,0,0,0.4);
            --frame-bg: #111;

            --orb-1: #d4af37;
            --orb-2: #323232;
            --orb-3: #14141e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        /* 优化：减少全局过渡的属性，只针对颜色，避免布局抖动 */
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Noto Serif SC', serif;
            height: 100vh; height: 100dvh;
            overflow: hidden;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: background-color 0.4s, color 0.4s;
        }

        /* === 优化后的背景 (CSS 代替 Canvas) === */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; pointer-events: none;
        }
        .orb {
            position: absolute; border-radius: 50%;
            filter: blur(60px); opacity: 0.5;
            animation: float 20s infinite ease-in-out alternate;
            /* 开启 GPU 加速 */
            will-change: transform;
            transform: translate3d(0,0,0);
        }
        .orb-1 { width: 60vw; height: 60vw; top: -10%; left: -10%; background: var(--orb-1); animation-delay: 0s; }
        .orb-2 { width: 50vw; height: 50vw; bottom: -10%; right: -10%; background: var(--orb-2); animation-delay: -5s; }
        .orb-3 { width: 40vw; height: 40vw; top: 40%; left: 40%; background: var(--orb-3); animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            50% { transform: translate3d(30px, 40px, 0) scale(1.1); }
            100% { transform: translate3d(-20px, 20px, 0) scale(0.95); }
        }

        /* 噪点层：使用静态图片而非 SVG 滤镜，提升渲染速度 */
        .texture-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.6; pointer-events: none; z-index: 0; mix-blend-mode: overlay;
        }

        /* === UI 组件 === */
        .gallery-header {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 20px 30px; display: flex; justify-content: space-between; align-items: center;
            z-index: 50;
        }
        .back-btn {
            font-family: 'Cinzel', serif; color: var(--text-secondary); text-decoration: none;
            font-size: 0.8rem; letter-spacing: 2px; border: 1px solid var(--glass-border);
            padding: 8px 15px; border-radius: 20px; background: var(--glass);
            display: flex; align-items: center; gap: 8px;
            /* 移除 backdrop-filter 以提升移动端性能 */
        }

        .theme-toggle {
            width: 36px; height: 36px; border-radius: 50%;
            border: 1px solid var(--glass-border); background: var(--glass);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; color: var(--text-primary);
        }
        .theme-toggle svg { width: 16px; height: 16px; fill: currentColor; }

        .gallery-container {
            width: 95%; max-width: 1200px; height: 85vh;
            display: flex; flex-direction: column;
            gap: 20px; position: relative; z-index: 10;
            opacity: 0; animation: fadeIn 0.8s ease-out forwards;
        }

        /* 主舞台 */
        .main-stage {
            flex: 1; 
            background: var(--frame-bg);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 4px;
            position: relative; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        /* 双缓冲图片层：用于平滑切换 */
        .image-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.6s ease-in-out;
            opacity: 0; z-index: 1; pointer-events: none;
        }
        .image-layer.active { opacity: 1; z-index: 2; pointer-events: auto; }
        
        .image-layer img {
            max-width: 96%; max-height: 96%;
            object-fit: contain; user-select: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            /* 硬件加速提示 */
            will-change: transform; 
            transform: translate3d(0,0,0);
        }

        /* 导航按钮 */
        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 50px; height: 50px; z-index: 5;
            background: rgba(255,255,255,0.2); /* 简单透明度代替模糊 */
            border: none; cursor: pointer; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            transition: background 0.3s, color 0.3s; color: var(--text-secondary);
        }
        .nav-btn:hover { background: var(--accent); color: #fff; }
        .nav-prev { left: 20px; }
        .nav-next { right: 20px; }
        .nav-btn svg { width: 20px; height: 20px; fill: currentColor; }

        /* 控制栏 */
        .controls-bar {
            position: absolute; bottom: 20px; right: 20px;
            display: flex; gap: 15px; align-items: center;
            background: var(--glass-heavy);
            padding: 8px 15px; border-radius: 30px; z-index: 5;
            font-family: 'Cinzel', serif; font-size: 0.8rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--glass-border);
        }
        .play-pause-btn { cursor: pointer; display: flex; align-items: center; color: var(--text-primary); }
        .counter { color: var(--accent); letter-spacing: 2px; }

        /* 缩略图栏 */
        .thumbs-strip {
            height: 100px; display: flex; gap: 10px;
            overflow-x: auto; padding: 5px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch; /* iOS 惯性滚动 */
            contain: content; /* 性能优化：限制重排范围 */
        }
        .thumbs-strip::-webkit-scrollbar { height: 4px; }
        .thumbs-strip::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

        .thumb-item {
            height: 100%; aspect-ratio: 1/1; flex-shrink: 0;
            background-size: cover; background-position: center;
            cursor: pointer; border-radius: 2px;
            opacity: 0.5; transition: opacity 0.3s, transform 0.3s;
            border: 2px solid transparent;
            /* 性能：使用 content-visibility 减少不可见区域的渲染消耗 */
            content-visibility: auto; 
        }
        .thumb-item.active {
            opacity: 1; border-color: var(--accent); transform: scale(0.95);
        }

        .loader {
            position: absolute; width: 40px; height: 40px; 
            border: 2px solid var(--glass-border); border-top-color: var(--accent); 
            border-radius: 50%; animation: spin 1s linear infinite; z-index: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { to { opacity: 1; } }

        @media (max-width: 768px) {
            .gallery-container { width: 100%; height: 100dvh; padding-bottom: 20px; gap: 10px; }
            .main-stage { border-radius: 0; border: none; }
            .nav-btn { display: none; } /* 移动端仅支持滑动 */
            .gallery-header { padding: 15px 20px; }
            .thumbs-strip { height: 70px; padding: 0 10px; }
            .controls-bar { bottom: 15px; right: 15px; font-size: 0.7rem; }
            /* 移动端彻底禁用模糊滤镜，极大提升帧率 */
            .orb { filter: blur(40px); } 
        }
    </style>
</head>
<body>

    <!-- 优化：纯 CSS 背景代替 Canvas -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="texture-overlay"></div>

    <header class="gallery-header">
        <a href="index.html" class="back-btn">
            <span>←</span> BACK
        </a>
        <div class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme">
            <svg class="icon-sun" viewBox="0 0 24 24" style="display:none;"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
        </div>
    </header>

    <div class="gallery-container">
        <!-- 主图展示区 (双缓冲结构) -->
        <div class="main-stage" id="mainStage">
            <div class="loader"></div>
            <!-- Layer A -->
            <div class="image-layer active" id="layerA">
                <img src="" alt="" draggable="false">
            </div>
            <!-- Layer B -->
            <div class="image-layer" id="layerB">
                <img src="" alt="" draggable="false">
            </div>
            
            <button class="nav-btn nav-prev" onclick="handleUserAction(-1)" aria-label="Previous Image">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <button class="nav-btn nav-next" onclick="handleUserAction(1)" aria-label="Next Image">
                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </button>

            <div class="controls-bar">
                <div class="play-pause-btn" onclick="togglePlay()" id="playBtn">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </div>
                <div class="counter" id="counter">00 / 00</div>
            </div>
        </div>

        <!-- 底部缩略图 -->
        <div class="thumbs-strip" id="thumbsContainer"></div>
    </div>

    <script>
        const imageUrls = [
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/69788810f1f9a.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/69788811a4109.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/6978881c3495e.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/6978881e48ff0.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/697888254b554.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/69788826ceab5.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/697888291de24.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/69788832f23fc.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/69788831f11bb.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/6978883a52fd5.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/6978883c110ec.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/6978883d78680.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/69788847eaef2.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/6978884ab992b.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/6978884fb54bf.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/69788850f149b.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/6978885236bbb.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/6978885dac008.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/6978885f77a83.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/69788863de5c9.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/69788865caea3.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/69788867cf735.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/6978887378f5b.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/697888782dd65.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/69788879b0603.webp"
        ];

        let currentIndex = 0;
        let isPlaying = true;
        let interval;
        let activeLayer = 'A'; // 'A' or 'B'
        
        const layerA = document.getElementById('layerA');
        const layerB = document.getElementById('layerB');
        const counter = document.getElementById('counter');
        const thumbsContainer = document.getElementById('thumbsContainer');
        const playBtn = document.getElementById('playBtn');

        // === 1. 初始化 ===
        function initGallery() {
            // 使用 DocumentFragment 减少重排
            const fragment = document.createDocumentFragment();
            
            imageUrls.forEach((url, index) => {
                const div = document.createElement('div');
                div.className = 'thumb-item';
                // 懒加载缩略图背景：仅在接近视口时加载
                // 由于CSS不能原生懒加载背景图，这里简化处理，但建议生产环境使用IntersectionObserver
                div.style.backgroundImage = `url(${url})`; 
                div.dataset.index = index;
                div.onclick = () => handleUserAction(index - currentIndex);
                fragment.appendChild(div);
            });
            thumbsContainer.appendChild(fragment);

            // 初始加载
            loadImageToLayer(layerA, imageUrls[0]);
            updateUI(0);
            preloadImage(1); // 仅预加载下一张
            startAutoPlay();
        }

        // === 2. 核心切换逻辑 (双缓冲) ===
        function updateGallery(newIndex) {
            if (newIndex < 0) newIndex = imageUrls.length - 1;
            if (newIndex >= imageUrls.length) newIndex = 0;
            
            currentIndex = newIndex;
            
            // 确定当前层和下一层
            const currentEl = activeLayer === 'A' ? layerA : layerB;
            const nextEl = activeLayer === 'A' ? layerB : layerA;
            const nextLayerCode = activeLayer === 'A' ? 'B' : 'A';

            // 预加载并切换
            const img = nextEl.querySelector('img');
            const targetUrl = imageUrls[currentIndex];
            
            // 如果图片已经在缓存中，切换会很快
            img.src = targetUrl;
            
            // 简单的淡入淡出逻辑
            img.onload = () => {
                nextEl.classList.add('active');
                currentEl.classList.remove('active');
                activeLayer = nextLayerCode;
                updateUI(currentIndex);
            };

            // 智能预加载：只加载下一张
            const nextPreload = (currentIndex + 1) % imageUrls.length;
            preloadImage(nextPreload);
        }

        function updateUI(index) {
            // 更新计数器
            counter.innerText = `${(index + 1).toString().padStart(2, '0')} / ${imageUrls.length}`;

            // 更新缩略图高亮
            const thumbs = document.querySelectorAll('.thumb-item');
            const activeThumb = document.querySelector('.thumb-item.active');
            if (activeThumb) activeThumb.classList.remove('active');
            
            if (thumbs[index]) {
                thumbs[index].classList.add('active');
                // 平滑滚动缩略图
                thumbs[index].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
        }

        function loadImageToLayer(layer, url) {
            const img = layer.querySelector('img');
            img.src = url;
        }

        // 简单的图片预加载器
        const cache = new Set();
        function preloadImage(index) {
            if (index < 0 || index >= imageUrls.length) return;
            const url = imageUrls[index];
            if (cache.has(url)) return;
            
            const img = new Image();
            img.src = url;
            img.onload = () => cache.add(url);
        }

        // === 3. 用户交互与播放控制 ===
        function handleUserAction(direction) {
            stopAutoPlay();
            if (Math.abs(direction) > 1) {
                // 点击缩略图跳转
                updateGallery(currentIndex + direction);
            } else {
                // 前后按钮
                updateGallery(currentIndex + direction);
            }
        }

        function startAutoPlay() {
            if(interval) clearInterval(interval);
            interval = setInterval(() => {
                updateGallery(currentIndex + 1);
            }, 3000);
            isPlaying = true;
            updatePlayBtn();
        }

        function stopAutoPlay() {
            if(interval) clearInterval(interval);
            isPlaying = false;
            updatePlayBtn();
        }

        function togglePlay() {
            if (isPlaying) stopAutoPlay();
            else startAutoPlay();
        }

        function updatePlayBtn() {
            playBtn.innerHTML = isPlaying 
                ? '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'
                : '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
        }

        // === 4. 触控优化 (Passive Event Listeners) ===
        let touchStartX = 0;
        const stage = document.getElementById('mainStage');

        stage.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            stopAutoPlay();
        }, {passive: true});

        stage.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].screenX;
            const threshold = 50;
            if (touchEndX < touchStartX - threshold) updateGallery(currentIndex + 1);
            if (touchEndX > touchStartX + threshold) updateGallery(currentIndex - 1);
        }, {passive: true});

        // === 5. 性能守卫：页面不可见时停止轮播 ===
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                if (interval) clearInterval(interval);
            } else {
                if (isPlaying) startAutoPlay();
            }
        });

        // === 6. 主题切换 ===
        const html = document.documentElement;
        const iconSun = document.querySelector('.icon-sun');
        const iconMoon = document.querySelector('.icon-moon');

        function toggleTheme() {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            
            iconSun.style.display = newTheme === 'dark' ? 'block' : 'none';
            iconMoon.style.display = newTheme === 'light' ? 'block' : 'none';
        }

        // 启动
        initGallery();

    </script>
</body>
</html>
