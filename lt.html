<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>核 | GALLERY - 映像</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+SC:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* === 核心变量 (保持统一风格) === */
        :root {
            --bg-color: #f4f4f0;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --accent: #bfa15f;
            --glass: rgba(255, 255, 255, 0.75);
            --glass-heavy: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(0, 0, 0, 0.06);
            --glass-shadow: 0 20px 40px rgba(0,0,0,0.08);
            --frame-bg: #e8e8e5; /* 画框底色 */
            
            /* 背景光斑颜色 */
            --orb-color-1: rgba(191, 161, 95, 0.4);
            --orb-color-2: rgba(200, 200, 200, 0.5);
            --orb-color-3: rgba(220, 210, 200, 0.6);
        }

        [data-theme="dark"] {
            --bg-color: #050505;
            --text-primary: #e0e0e0;
            --text-secondary: #8c8c8c;
            --accent: #d4af37;
            --glass: rgba(20, 20, 20, 0.7);
            --glass-heavy: rgba(20, 20, 20, 0.95);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 20px 50px rgba(0,0,0,0.6);
            --frame-bg: #111;

            --orb-color-1: rgba(212, 175, 55, 0.15);
            --orb-color-2: rgba(50, 50, 50, 0.3);
            --orb-color-3: rgba(20, 20, 30, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; transition: color 0.4s, background-color 0.4s, border-color 0.4s; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Noto Serif SC', serif;
            height: 100vh; height: 100dvh;
            overflow: hidden; /* 画廊页禁止整体滚动，只允许内部滚动 */
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        /* === 艺术背景 === */
        #art-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; filter: blur(80px); opacity: 0.8; transform: scale(1.2);
        }
        .texture-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.6; pointer-events: none; z-index: 0; mix-blend-mode: overlay;
        }

        /* === 顶部导航 === */
        .gallery-header {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 20px 30px; display: flex; justify-content: space-between; align-items: center;
            z-index: 50;
        }
        .back-btn {
            font-family: 'Cinzel', serif; color: var(--text-secondary); text-decoration: none;
            font-size: 0.8rem; letter-spacing: 2px; border: 1px solid var(--glass-border);
            padding: 8px 15px; border-radius: 20px; background: var(--glass);
            transition: all 0.3s; display: flex; align-items: center; gap: 8px;
        }
        .back-btn:hover { border-color: var(--accent); color: var(--text-primary); }

        .theme-toggle {
            width: 36px; height: 36px; border-radius: 50%;
            border: 1px solid var(--glass-border); background: var(--glass);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; color: var(--text-primary); transition: all 0.3s;
        }
        .theme-toggle svg { width: 16px; height: 16px; fill: currentColor; }

        /* === 画廊主容器 === */
        .gallery-container {
            width: 95%; max-width: 1200px; height: 85vh;
            display: flex; flex-direction: column;
            gap: 20px; position: relative; z-index: 10;
            animation: fadeIn 1s ease-out;
        }

        /* 主舞台 (大图) */
        .main-stage {
            flex: 1; 
            background: var(--frame-bg);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        .main-image {
            max-width: 96%; max-height: 96%;
            object-fit: contain;
            opacity: 0; /* JS控制淡入 */
            transition: opacity 0.5s ease-in-out;
            user-select: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .main-image.active { opacity: 1; }

        /* 左右切换按钮 */
        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 50px; height: 50px;
            background: rgba(0,0,0,0.05);
            border: none; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.3s; color: var(--text-secondary);
            border-radius: 50%; backdrop-filter: blur(5px);
            opacity: 0; /* 悬停显示 */
        }
        .main-stage:hover .nav-btn { opacity: 1; }
        .nav-btn:hover { background: var(--accent); color: #fff; }
        .nav-prev { left: 20px; }
        .nav-next { right: 20px; }
        .nav-btn svg { width: 20px; height: 20px; fill: currentColor; }

        /* 播放控制 & 计数器 */
        .controls-bar {
            position: absolute; bottom: 20px; right: 20px;
            display: flex; gap: 15px; align-items: center;
            background: var(--glass-heavy);
            padding: 8px 15px; border-radius: 30px;
            font-family: 'Cinzel', serif; font-size: 0.8rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 1px solid var(--glass-border);
        }
        .play-pause-btn { cursor: pointer; display: flex; align-items: center; color: var(--text-primary); }
        .counter { color: var(--accent); letter-spacing: 2px; }

        /* 缩略图栏 */
        .thumbs-strip {
            height: 100px;
            display: flex; gap: 10px;
            overflow-x: auto;
            padding: 5px;
            scroll-behavior: smooth;
            /* 隐藏滚动条但保留功能 */
            scrollbar-width: thin;
            scrollbar-color: var(--accent) transparent;
        }
        .thumbs-strip::-webkit-scrollbar { height: 4px; }
        .thumbs-strip::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

        .thumb-item {
            height: 100%; aspect-ratio: 1/1;
            flex-shrink: 0;
            background-size: cover; background-position: center;
            cursor: pointer;
            border-radius: 2px;
            opacity: 0.5; filter: grayscale(80%);
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .thumb-item:hover { opacity: 0.8; filter: grayscale(0%); }
        .thumb-item.active {
            opacity: 1; filter: grayscale(0%);
            border-color: var(--accent);
            transform: scale(0.95);
        }

        /* 加载动画 */
        .loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 40px; height: 40px; border: 2px solid var(--glass-border);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 1s linear infinite; z-index: -1;
        }
        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .gallery-container { width: 100%; height: 100dvh; max-height: none; padding-bottom: 20px; gap: 10px; }
            .main-stage { border-radius: 0; border-left: none; border-right: none; }
            .nav-btn { display: none; /* 移动端用滑动手势 */ }
            .gallery-header { padding: 15px 20px; }
            .thumbs-strip { height: 70px; padding: 0 10px; }
            .controls-bar { bottom: 15px; right: 15px; padding: 5px 12px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <canvas id="art-canvas"></canvas>
    <div class="texture-overlay"></div>

    <header class="gallery-header">
        <a href="index.html" class="back-btn">
            <span>←</span> BACK
        </a>
        <div class="theme-toggle" onclick="toggleTheme()">
            <svg class="icon-sun" viewBox="0 0 24 24" style="display:none;"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
        </div>
    </header>

    <div class="gallery-container">
        <!-- 主图展示区 -->
        <div class="main-stage" id="mainStage">
            <div class="loader"></div>
            <img src="" alt="Gallery Image" class="main-image" id="activeImage">
            
            <button class="nav-btn nav-prev" onclick="changeImage(-1)">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <button class="nav-btn nav-next" onclick="changeImage(1)">
                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </button>

            <div class="controls-bar">
                <div class="play-pause-btn" onclick="togglePlay()" id="playBtn">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </div>
                <div class="counter" id="counter">01 / 25</div>
            </div>
        </div>

        <!-- 底部缩略图 -->
        <div class="thumbs-strip" id="thumbsContainer">
            <!-- JS 生成缩略图 -->
        </div>
    </div>

    <script>
        // === 图片数据 ===
        const imageUrls = [
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/69788810f1f9a.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/69788811a4109.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/6978881c3495e.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/6978881e48ff0.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/697888254b554.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/69788826ceab5.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/697888291de24.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/69788832f23fc.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/69788831f11bb.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/6978883a52fd5.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/6978883c110ec.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/6978883d78680.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/69788847eaef2.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/6978884ab992b.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/6978884fb54bf.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/69788850f149b.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/6978885236bbb.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/6978885dac008.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/6978885f77a83.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/69788863de5c9.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/69788865caea3.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/69788867cf735.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/6978887378f5b.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/697888782dd65.webp",
            "https://youke.xn--y7xa690gmna.cn/s1/2026/01/27/69788879b0603.webp"
        ];

        let currentIndex = 0;
        let isPlaying = true;
        let interval;
        const mainImage = document.getElementById('activeImage');
        const counter = document.getElementById('counter');
        const thumbsContainer = document.getElementById('thumbsContainer');
        const playBtn = document.getElementById('playBtn');

        // === 初始化 ===
        function initGallery() {
            // 生成缩略图
            imageUrls.forEach((url, index) => {
                const div = document.createElement('div');
                div.className = 'thumb-item';
                div.style.backgroundImage = `url(${url})`;
                div.onclick = () => {
                    stopAutoPlay(); // 用户干预停止轮播
                    updateGallery(index);
                };
                thumbsContainer.appendChild(div);
            });

            // 预加载首图
            preloadImage(imageUrls[0], () => {
                updateGallery(0);
                startAutoPlay();
            });
        }

        // === 更新画廊状态 ===
        function updateGallery(index) {
            // 循环逻辑
            if (index < 0) index = imageUrls.length - 1;
            if (index >= imageUrls.length) index = 0;
            
            currentIndex = index;

            // 图片淡出淡入
            mainImage.classList.remove('active');
            
            // 简单预加载当前图，防止白屏
            const tempImg = new Image();
            tempImg.src = imageUrls[currentIndex];
            tempImg.onload = () => {
                mainImage.src = imageUrls[currentIndex];
                mainImage.classList.add('active');
            };

            // 更新计数器
            counter.innerText = `${(currentIndex + 1).toString().padStart(2, '0')} / ${imageUrls.length}`;

            // 更新缩略图高亮
            const thumbs = document.querySelectorAll('.thumb-item');
            thumbs.forEach(t => t.classList.remove('active'));
            thumbs[currentIndex].classList.add('active');

            // 缩略图自动滚动可视区域
            thumbs[currentIndex].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }

        function changeImage(direction) {
            stopAutoPlay();
            updateGallery(currentIndex + direction);
        }

        // === 轮播控制 ===
        function startAutoPlay() {
            if(interval) clearInterval(interval);
            interval = setInterval(() => {
                updateGallery(currentIndex + 1);
            }, 3000); // 3秒切换
            isPlaying = true;
            updatePlayBtn();
        }

        function stopAutoPlay() {
            if(interval) clearInterval(interval);
            isPlaying = false;
            updatePlayBtn();
        }

        function togglePlay() {
            if (isPlaying) stopAutoPlay();
            else startAutoPlay();
        }

        function updatePlayBtn() {
            if (isPlaying) {
                // 显示暂停图标
                playBtn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
            } else {
                // 显示播放图标
                playBtn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
            }
        }

        // 预加载工具
        function preloadImage(url, callback) {
            const img = new Image();
            img.src = url;
            img.onload = callback;
        }

        // === 触控滑动支持 (Mobile) ===
        let touchStartX = 0;
        let touchEndX = 0;
        const stage = document.getElementById('mainStage');

        stage.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            stopAutoPlay(); // 触摸即停止自动轮播
        }, {passive: true});

        stage.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            const threshold = 50; // 滑动阈值
            if (touchEndX < touchStartX - threshold) changeImage(1); // 左滑下一张
            if (touchEndX > touchStartX + threshold) changeImage(-1); // 右滑上一张
        }

        initGallery();


        // === 视觉效果：深浅切换 & 动态背景 (复用逻辑) ===
        const html = document.documentElement;
        const iconSun = document.querySelector('.icon-sun');
        const iconMoon = document.querySelector('.icon-moon');

        function toggleTheme() {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            if(newTheme === 'dark') { iconMoon.style.display='none'; iconSun.style.display='block'; }
            else { iconSun.style.display='none'; iconMoon.style.display='block'; }
            updateOrbColors();
        }
        // 初始化图标
        iconSun.style.display='none'; iconMoon.style.display='block';

        // 艺术背景
        const canvas = document.getElementById('art-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, orbs = [], colors = [];

        function getCssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
        function updateOrbColors() {
            colors = [getCssVar('--orb-color-1'), getCssVar('--orb-color-2'), getCssVar('--orb-color-3')];
            orbs.forEach(orb => orb.color = colors[Math.floor(Math.random() * colors.length)]);
        }
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        class Orb {
            constructor() { this.init(); }
            init() {
                this.x = Math.random() * width; this.y = Math.random() * height;
                this.radius = Math.random() * 200 + 150; 
                this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.growth = 0;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < -100 || this.x > width + 100) this.vx *= -1;
                if (this.y < -100 || this.y > height + 100) this.vy *= -1;
                this.growth += 0.01;
                this.currentRadius = this.radius + Math.sin(this.growth) * 30;
            }
            draw() {
                ctx.beginPath(); ctx.fillStyle = this.color;
                ctx.arc(this.x, this.y, this.currentRadius, 0, Math.PI * 2); ctx.fill();
            }
        }
        function initOrbs() { updateOrbColors(); orbs = []; for (let i = 0; i < 6; i++) orbs.push(new Orb()); }
        function animate() {
            ctx.clearRect(0, 0, width, height);
            ctx.globalCompositeOperation = html.getAttribute('data-theme') === 'light' ? 'multiply' : 'screen';
            for (let i = 0; i < orbs.length; i++) { orbs[i].update(); orbs[i].draw(); }
            requestAnimationFrame(animate);
        }
        initOrbs(); animate();
    </script>
</body>
</html>
